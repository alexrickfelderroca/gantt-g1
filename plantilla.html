<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de Trabajo G1</title>
<meta name="description" content="Diagrama de Gantt del Proyecto Integrado 2º GETI — Grupo 1, curso 26/27.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --surface:#fff; --card:#fff; --sunken:#f5f5f3; --hito:#eef3fa;
  --ink:#111; --ink-2:#55544f; --ink-3:#8b8a85;
  --line:#e7e5e0; --line-2:#d2cfc8;
  --bar:#2a78d6; --crit:#e34948; --crit-soft:#fbe6e5; --accent:#0d366b;
  --ok:#1baf7a;
  --nomb:330px; --col:32px; --fila:34px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:26px 16px 80px}

h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--ink-3);margin:0 0 20px;font-size:13.5px}

.ctr{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 10px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
button{font:inherit;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;min-height:32px;transition:.12s}
button:hover{border-color:var(--line-2);color:var(--ink)}
button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.spacer{flex:1}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink-2);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:10px;border-radius:3px;display:inline-block}
.sw.b{background:var(--bar)} .sw.c{background:var(--crit)}
.sw.h{background:var(--hito);border:1px solid var(--line-2)}

.chart{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto;position:relative}
.grid{width:max-content;min-width:100%}

.hd{display:flex;position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line-2)}
.pad{flex:0 0 var(--nomb);position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line-2)}
.cols{display:flex}
.hmes{display:flex;height:24px;border-bottom:1px solid var(--line)}
.hmes span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  padding:5px 0 0 6px;border-left:1px solid var(--line-2);overflow:hidden;white-space:nowrap}
.hmes span:first-child{border-left:0}
.hses{display:flex;height:34px}
.hses i{flex:0 0 var(--col);font-style:normal;font-size:9.5px;line-height:1.15;color:var(--ink-3);
  text-align:center;padding-top:5px;border-left:1px solid var(--line);white-space:nowrap}
.hses i b{display:block;font-size:11px;font-weight:700;color:var(--ink-2)}
.hses i.control,.hses i.entrega{background:var(--hito)}
.hses i.control b,.hses i.entrega b{color:var(--accent)}
.hses i.hoy{background:var(--accent)}
.hses i.hoy,.hses i.hoy b{color:#fff}

.phase{display:flex;background:var(--sunken);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.phase b{flex:0 0 var(--nomb);position:sticky;left:0;z-index:3;background:var(--sunken);padding:7px 14px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.row{display:flex;border-bottom:1px solid var(--line);height:var(--fila)}
.row:last-of-type{border-bottom:0}
.row .name{flex:0 0 var(--nomb);position:sticky;left:0;z-index:3;background:#fff;min-width:0;
  padding:0 10px 0 10px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px;
  border-right:1px solid var(--line-2)}
.row:hover .name{background:var(--sunken)}
.row.hecha .name .txt{text-decoration:line-through;color:var(--ink-3)}
.row.hecha .bar{opacity:.3}

.tick{flex:0 0 auto;width:17px;height:17px;padding:0;min-height:0;border-radius:4px;
  border:1.5px solid var(--line-2);background:#fff;cursor:pointer;position:relative}
.tick:hover{border-color:var(--ink-3)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}

.ini{flex:0 0 auto;display:flex;gap:2px;background:none;border:0;padding:2px;min-height:0;cursor:pointer;border-radius:5px}
.ini:hover{background:var(--hito)}
.ini span{font-size:9px;font-weight:700;letter-spacing:.03em;color:var(--ink-2);background:var(--sunken);
  border:1px solid var(--line-2);border-radius:3px;padding:2px 3px;line-height:1}
.ini span.mas{background:#fff;color:var(--ink-3)}
.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}

.trk{position:relative;flex:0 0 auto;display:flex}
.trk u{flex:0 0 var(--col);border-left:1px solid var(--line);text-decoration:none}
.trk u.hito{background:var(--hito)}
.row:hover .trk{background:rgba(0,0,0,.02)}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:18px;border-radius:5px;
  background:var(--bar);z-index:2;cursor:pointer}
.bar.crit{background:var(--crit)}
.bar:hover{filter:brightness(1.08)}

/* ---------- modal ---------- */
.velo{position:fixed;inset:0;background:rgba(15,15,15,.45);display:none;z-index:50;
  align-items:center;justify-content:center;padding:20px}
.velo.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.28);padding:26px 28px 24px}
.modal h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.modal .cuando{color:var(--ink-3);font-size:13px;margin:0 0 16px}
.modal .desc{margin:0 0 18px;color:var(--ink-2);font-size:14.5px}
.modal dl{display:grid;grid-template-columns:118px 1fr;gap:9px 14px;margin:0 0 18px;font-size:13.5px}
.modal dt{color:var(--ink-3);font-weight:500}
.modal dd{margin:0;color:var(--ink-2)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border-radius:4px;padding:3px 7px}
.badge.guia{background:#e6f4ee;color:#0d6b4a}
.badge.plan{background:#e8eefa;color:#1c4b8f}
.badge.grupo{background:#fdf0e3;color:#8a5115}
.badge.crit{background:var(--crit-soft);color:#a32a29}
.modal h3{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 9px;padding-top:16px;border-top:1px solid var(--line)}
.docs{list-style:none;margin:0 0 12px;padding:0;font-size:13.5px}
.docs li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.docs a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs a:hover{text-decoration:underline}
.docs .mio{font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:3px;padding:1px 5px}
.docs .quitar{margin-left:auto;flex:0 0 auto;border:0;background:none;color:var(--ink-3);font-size:17px;
  line-height:1;padding:0 4px;min-height:0;cursor:pointer;border-radius:4px}
.docs .quitar:hover{color:var(--crit);background:var(--crit-soft)}
.docs .quitar:disabled{opacity:.4;cursor:default}
.docs .icono{flex:0 0 auto;font-size:13px;opacity:.75}

.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mas{font-size:13px;font-weight:500;border:1px dashed var(--line-2);border-radius:8px;padding:9px 14px}
.mas:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.subiendo{font-size:12.5px;color:var(--ink-2);background:var(--sunken);border-radius:7px;
  padding:9px 12px;margin-bottom:10px}
.subiendo .mal{color:var(--crit)}

.estado{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.estado::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.estado.ok::before{background:var(--ok)}
.estado.err::before{background:var(--crit)}
.estado.err{color:var(--crit)}
.estado.off::before{background:#e0a020}
.vacio{color:var(--ink-3);font-size:13.5px;margin:0 0 12px}
.addoc{display:flex;gap:7px;flex-wrap:wrap}
.addoc input{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line-2);border-radius:7px;flex:1;min-width:130px}
.nota{font-size:12px;color:var(--ink-3);margin:10px 0 0;line-height:1.45}
.cerrar{position:sticky;top:0;float:right;background:none;border:0;font-size:22px;line-height:1;color:var(--ink-3);
  padding:0 0 0 12px;min-height:0;cursor:pointer}

.tarjetas{display:none}
.tar{border:1px solid var(--line);border-left:3px solid var(--bar);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.tar.crit{border-left-color:var(--crit)}
.tar.hecha h3{text-decoration:line-through;color:var(--ink-3)}
.tar h3{margin:0 0 4px;font-size:14.5px;font-weight:600;line-height:1.35}
.tar p{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.tar .meta{font-size:12.5px;color:var(--ink-3)}
.lfase{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
footer p{margin:4px 0}

@media (max-width:820px){
  .chart,.legend,#f-esc{display:none}
  .tarjetas{display:block}
  .modal{padding:22px 20px}
}
</style>
</head>
<body>
<div class="wrap">

<h1>Plan de trabajo — Grupo 1</h1>
<p class="sub">Cada columna es una sesión de prácticas del Grupo 1. Pulsa las iniciales para ver el detalle.</p>

<div class="ctr">
  <span class="lbl">Quién</span>
  <button id="f-todo" aria-pressed="true">Todos</button>
  <span id="f-per"></span>
</div>
<div class="ctr">
  <span class="lbl">Filtrar</span>
  <button id="f-crit" aria-pressed="false">Solo camino crítico</button>
  <button id="f-guia" aria-pressed="false">Solo lo que exige la Guía</button>
  <button id="f-pend" aria-pressed="false">Solo pendientes</button>
</div>

<div class="legend">
  <span><i class="sw b"></i> Tarea</span>
  <span><i class="sw c"></i> Camino crítico</span>
  <span><i class="sw h"></i> Control o entrega</span>
  <span class="spacer"></span>
  <span class="estado" id="estado">…</span>
</div>

<div class="chart"><div class="scroll" id="scroll"><div class="grid" id="grid"></div></div></div>

<div class="tarjetas" id="tarjetas"></div>

<footer>
  <p id="pie"></p>
  <p>Equipo: Alex R. · Raul O. · Jan D. · Victor G. · Marc B. · Ignasi S. · Jordi A.</p>
</footer>
</div>

<div class="velo" id="velo"><div class="modal" id="modal"></div></div>

<script>
const DATOS = /*__DATOS__*/{}/*__FIN__*/;
const CFG   = /*__CFG__*/{}/*__FINCFG__*/;
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA = ['dom','lun','mar','mié','jue','vie','sáb'];
const HOY = '21/09/2026';
const d = s => { const [a,b,c] = s.split('/').map(Number); return new Date(c,b-1,a); };
const FUENTE = {
  guia:  ['guia','Guía'],
  plan:  ['plan','Planificación'],
  grupo: ['grupo','Decisión del grupo'],
};

const SES = DATOS.sesiones;
const idx = f => SES.findIndex(s => s.fecha === f);
// primera sesión >= fecha  /  última sesión <= fecha
const desde = f => { const x = d(f); for (let i=0;i<SES.length;i++) if (d(SES[i].fecha) >= x) return i; return SES.length-1; };
const hasta = f => { const x = d(f); for (let i=SES.length-1;i>=0;i--) if (d(SES[i].fecha) <= x) return i; return 0; };

/* ---------- estado compartido ----------
   Con Supabase configurado, lo que marca uno lo ven todos.
   Sin configurar, la página sigue funcionando pero solo en tu navegador. */
const LS = {
  get(k, def){ try { const v = localStorage.getItem(k); return v==null ? def : JSON.parse(v); } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
const DB = {
  on: !!(CFG.url && CFG.key),
  cab(extra){
    return Object.assign({
      apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json',
    }, extra || {});
  },
  async get(tabla){
    const r = await fetch(CFG.url + '/rest/v1/' + tabla + '?select=*', { headers: this.cab() });
    if (!r.ok) throw new Error(tabla + ': ' + r.status);
    return r.json();
  },
  async marcar(id, hecha){
    const r = await fetch(CFG.url + '/rest/v1/estado_tareas', {
      method: 'POST',
      headers: this.cab({ Prefer: 'resolution=merge-duplicates' }),
      body: JSON.stringify({ tarea_id: id, hecha, marcado_en: new Date().toISOString() }),
    });
    if (!r.ok) throw new Error('marcar: ' + r.status);
  },
  async atar(id, nombre, url, storagePath){
    const r = await fetch(CFG.url + '/rest/v1/documentos', {
      method: 'POST', headers: this.cab(),
      body: JSON.stringify({ tarea_id: id, nombre, url, storage_path: storagePath || null }),
    });
    if (!r.ok) throw new Error('atar: ' + r.status + ' ' + (await r.text()).slice(0,120));
  },
  async desatar(docId, storagePath){
    if (storagePath){
      // Borra primero el archivo; si ya no estaba, seguimos igualmente.
      await fetch(CFG.url + '/storage/v1/object/documentos/' + storagePath, {
        method: 'DELETE', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key },
      }).catch(() => {});
    }
    const r = await fetch(CFG.url + '/rest/v1/documentos?id=eq.' + docId, {
      method: 'DELETE', headers: this.cab(),
    });
    if (!r.ok) throw new Error('desatar: ' + r.status);
  },
  // Sube un archivo al cubo público y devuelve {url, path}
  async subir(tareaId, archivo){
    const limpio = archivo.name.replace(/[^\w.\-]+/g, '_');
    const path = tareaId + '/' + Date.now() + '-' + limpio;
    const r = await fetch(CFG.url + '/storage/v1/object/documentos/' + path, {
      method: 'POST',
      headers: {
        apikey: CFG.key, Authorization: 'Bearer ' + CFG.key,
        'Content-Type': archivo.type || 'application/octet-stream',
        'x-upsert': 'true',
      },
      body: archivo,
    });
    if (!r.ok) throw new Error('subir: ' + r.status + ' ' + (await r.text()).slice(0,120));
    return { url: CFG.url + '/storage/v1/object/public/documentos/' + path, path };
  },
};
const MAX_MB = 45;
const peso = b => b < 1024*1024 ? Math.round(b/1024) + ' KB' : (b/1048576).toFixed(1) + ' MB';

let hechas  = DB.on ? [] : LS.get('g1-hechas', []);
let dbDocs  = {};                       // tarea_id -> [{id, nombre, url}]
let misDocs = DB.on ? {} : LS.get('g1-docs', {});
let cuando  = {};                       // tarea_id -> fecha de marcado

function estado(txt, clase){
  const el = document.getElementById('estado');
  if (el){ el.textContent = txt; el.className = 'estado ' + (clase || ''); }
}

async function sincronizar(silencioso){
  if (!DB.on){ estado('Sin base de datos: lo que marques solo lo ves tú', 'off'); return; }
  try {
    if (!silencioso) estado('Sincronizando…', '');
    const [est, docs] = await Promise.all([DB.get('estado_tareas'), DB.get('documentos')]);
    hechas = est.filter(x => x.hecha).map(x => x.tarea_id);
    cuando = {}; est.forEach(x => { if (x.hecha) cuando[x.tarea_id] = x.marcado_en; });
    dbDocs = {};
    docs.forEach(x => { (dbDocs[x.tarea_id] = dbDocs[x.tarea_id] || []).push(x); });
    estado('Al día — lo que marcas lo ve todo el grupo', 'ok');
    render();
  } catch (e) {
    estado('Sin conexión con la base de datos: ' + e.message, 'err');
  }
}

let fPer = null, fCrit = false, fGuia = false, fPend = false;

/* ---------- pintar ---------- */
function cabecera(){
  let meses = '', ini = 0;
  for (let i=1; i<=SES.length; i++){
    const cambia = i===SES.length || d(SES[i].fecha).getMonth() !== d(SES[ini].fecha).getMonth();
    if (cambia){
      const f = d(SES[ini].fecha);
      const an = f.getFullYear()===2027 ? " '27" : '';
      meses += '<span style="flex:0 0 '+((i-ini)*32)+'px">'+MES[f.getMonth()]+an+'</span>';
      ini = i;
    }
  }
  const ses = SES.map(function(s){
    const f = d(s.fecha), cls = s.fecha===HOY ? 'hoy' : s.tipo;
    return '<i class="'+cls+'" title="'+(s.nota||DIA[f.getDay()]+' '+s.fecha)+'">'
         + DIA[f.getDay()] + '<b>' + f.getDate() + '</b></i>';
  }).join('');
  return '<div class="hd"><div class="pad"></div><div><div class="hmes">'+meses+'</div>'
       + '<div class="hses">'+ses+'</div></div></div>';
}

const celdas = SES.map(s => '<u class="'+(s.tipo!=='sesion'?'hito':'')+'"></u>').join('');

function fila(t){
  const a = desde(t.inicio), b = hasta(t.fin);
  const l = a*32, w = Math.max((b-a+1)*32 - 4, 12);
  const chips = t.responsables.length > 3
    ? t.responsables.slice(0,2).map(r => '<span>'+ini(r)+'</span>').join('')
        + '<span class="mas">+'+(t.responsables.length-2)+'</span>'
    : t.responsables.map(r => '<span>'+ini(r)+'</span>').join('');
  return '<div class="row'+(hechas.includes(t.id)?' hecha':'')+'" data-id="'+t.id+'">'
    + '<div class="name">'
    +   '<button class="tick" data-tick="'+t.id+'" aria-pressed="'+hechas.includes(t.id)+'" '
    +     'title="Marcar como hecha" aria-label="Marcar '+esc(t.nombre)+' como hecha"></button>'
    +   '<button class="ini" data-ver="'+t.id+'" title="Ver detalle">'+chips+'</button>'
    +   '<span class="txt" title="'+esc(t.nombre)+'">'+esc(t.nombre)+'</span>'
    + '</div>'
    + '<div class="trk">'+celdas
    +   '<div class="bar'+(t.critica?' crit':'')+'" data-ver="'+t.id+'" '
    +   'style="left:'+(l+2)+'px;width:'+w+'px"></div>'
    + '</div></div>';
}

const ini = n => n.replace('.','').split(' ').map(w => w[0]).join('').toUpperCase();
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function render(){
  let h = cabecera();
  DATOS.fases.forEach(function(fase){
    const ts = DATOS.tareas.filter(t => t.fase===fase && visible(t));
    if (!ts.length) return;
    h += '<div class="phase"><b title="'+esc(fase)+'">'+esc(fase)+'</b>'
       + '<div class="trk">'+celdas+'</div></div>';
    ts.forEach(t => h += fila(t));
  });
  document.getElementById('grid').innerHTML = h || '<p style="padding:30px;color:#888">Nada que mostrar con estos filtros.</p>';

  let c = '';
  DATOS.fases.forEach(function(fase){
    const ts = DATOS.tareas.filter(t => t.fase===fase && visible(t));
    if (!ts.length) return;
    c += '<div class="lfase">'+esc(fase)+'</div>';
    ts.forEach(function(t){
      c += '<div class="tar'+(t.critica?' crit':'')+(hechas.includes(t.id)?' hecha':'')+'" data-ver="'+t.id+'">'
        + '<h3>'+esc(t.nombre)+'</h3><p>'+esc(t.descripcion)+'</p>'
        + '<div class="meta">'+t.responsables.join(' · ')+' — '+t.inicio+' → '+t.fin+'</div></div>';
    });
  });
  document.getElementById('tarjetas').innerHTML = c;

  const v = DATOS.tareas.filter(visible).length;
  document.getElementById('pie').textContent =
    v + ' de ' + DATOS.tareas.length + ' tareas · ' + SES.length + ' sesiones del G1 · '
    + hechas.length + ' marcadas como hechas';
}

function visible(t){
  if (fPer && !t.responsables.includes(fPer)) return false;
  if (fCrit && !t.critica) return false;
  if (fGuia && t.fuente !== 'guia') return false;
  if (fPend && hechas.includes(t.id)) return false;
  return true;
}

/* ---------- modal ---------- */
function abrir(id){
  const t = DATOS.tareas.find(x => x.id===id); if (!t) return;
  const f = FUENTE[t.fuente] || ['grupo','—'];
  const docs = (t.docs||[]).map(x => ({...x, fijo:true}))
    .concat((dbDocs[id]||[]).map(x => ({...x, fijo:false})))
    .concat((misDocs[id]||[]).map((x, i) => ({...x, fijo:false, solomio:true, local:i})));
  const marca = cuando[t.id]
    ? ' · marcada el ' + new Date(cuando[t.id]).toLocaleDateString('es-ES',
        {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})
    : '';
  document.getElementById('modal').innerHTML =
      '<button class="cerrar" data-cerrar aria-label="Cerrar">&times;</button>'
    + '<h2>'+esc(t.nombre)+'</h2>'
    + '<p class="cuando">'+t.inicio+' → '+t.fin+' · '+esc(t.fase)+'</p>'
    + '<p class="desc">'+esc(t.descripcion)+'</p>'
    + '<dl>'
    +   '<dt>Responsables</dt><dd>'+t.responsables.join(', ')+'</dd>'
    +   '<dt>De dónde sale</dt><dd><span class="badge '+f[0]+'">'+f[1]+'</span>'
    +     (t.cita ? '<br><span style="font-size:12.5px;color:#8b8a85">'+esc(t.cita)+'</span>' : '')+'</dd>'
    +   (t.critica ? '<dt>Camino crítico</dt><dd><span class="badge crit">sin holgura</span></dd>' : '')
    +   '<dt>Estado</dt><dd>'+(hechas.includes(t.id)?'Hecha':'Pendiente')+marca+'</dd>'
    + '</dl>'
    + '<h3>Documentos</h3>'
    + (docs.length
        ? '<ul class="docs">'+docs.map(function(x){
            const borrar = x.id
              ? '<button class="quitar" data-quitar="'+x.id+'" data-tarea="'+t.id+'" '
                + 'data-path="'+esc(x.storage_path||'')+'" title="Borrar" aria-label="Borrar documento">&times;</button>'
              : (x.local !== undefined
                  ? '<button class="quitar" data-quitar-local="'+x.local+'" data-tarea="'+t.id+'" '
                    + 'title="Borrar" aria-label="Borrar documento">&times;</button>'
                  : '');
            return '<li>'
              + '<span class="icono">'+(x.storage_path ? '📎' : '🔗')+'</span>'
              + '<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.nombre)+'</a>'
              + (x.solomio ? '<span class="mio">solo tú</span>' : '')
              + (x.fijo ? '<span class="mio">del código</span>' : '')
              + borrar + '</li>';
          }).join('')+'</ul>'
        : '<p class="vacio">Todavía no hay ningún documento atado a esta tarea.</p>')
    + '<div id="subiendo" class="subiendo" hidden></div>'
    + '<div class="acciones">'
    +   '<button class="mas" data-subir="'+t.id+'">＋ Subir archivo</button>'
    +   '<button class="mas" data-enlace="'+t.id+'">🔗 Añadir enlace</button>'
    +   '<input type="file" id="picker" multiple hidden>'
    + '</div>'
    + '<div class="addoc" id="formenlace" hidden>'
    +   '<input id="dn" placeholder="Nombre del documento">'
    +   '<input id="du" placeholder="https://…">'
    +   '<button data-add="'+t.id+'">Atar</button>'
    + '</div>'
    + '<p class="nota">'
    + (DB.on
        ? 'Los archivos se suben al almacenamiento del grupo y los ve todo el mundo. '
          + 'Máximo ' + MAX_MB + ' MB por archivo. Para algo más grande, usa el enlace a OneDrive.'
        : '⚠️ Sin base de datos conectada no se pueden subir archivos, y lo que ates aquí '
          + 'solo lo verás tú en este navegador.')
    + '</p>';
  document.getElementById('velo').classList.add('on');
}
function cerrar(){ document.getElementById('velo').classList.remove('on'); }

async function subirArchivos(tareaId, lista){
  const archivos = [...lista];
  if (!archivos.length) return;
  const caja = document.getElementById('subiendo');
  const grandes = archivos.filter(a => a.size > MAX_MB * 1048576);
  if (grandes.length){
    caja.hidden = false;
    caja.innerHTML = '<span class="mal">Demasiado grande: ' + grandes.map(a => esc(a.name)
      + ' (' + peso(a.size) + ')').join(', ') + '. El tope son ' + MAX_MB
      + ' MB — sube ese a OneDrive y ata el enlace.</span>';
    if (grandes.length === archivos.length) return;
  }
  const buenos = archivos.filter(a => a.size <= MAX_MB * 1048576);
  for (let i = 0; i < buenos.length; i++){
    const a = buenos[i];
    caja.hidden = false;
    caja.innerHTML = 'Subiendo ' + (i+1) + ' de ' + buenos.length + ': '
                   + esc(a.name) + ' (' + peso(a.size) + ')…';
    try {
      const sub = await DB.subir(tareaId, a);
      await DB.atar(tareaId, a.name, sub.url, sub.path);
    } catch (err) {
      caja.innerHTML = '<span class="mal">Falló ' + esc(a.name) + ': ' + esc(err.message) + '</span>';
      return;
    }
  }
  await sincronizar(true);
  abrir(tareaId);
}

/* ---------- eventos ---------- */
document.addEventListener('click', function(e){
  const tick = e.target.closest('[data-tick]');
  if (tick){
    const id = tick.dataset.tick, marcar = !hechas.includes(id);
    const previo = hechas.slice();
    hechas = marcar ? hechas.concat(id) : hechas.filter(x => x!==id);   // pintado optimista
    if (marcar) cuando[id] = new Date().toISOString(); else delete cuando[id];
    render();
    if (DB.on){
      DB.marcar(id, marcar)
        .then(() => estado('Al día — lo que marcas lo ve todo el grupo', 'ok'))
        .catch(err => { hechas = previo; render(); estado('No se pudo guardar: ' + err.message, 'err'); });
    } else {
      LS.set('g1-hechas', hechas);
    }
    return;
  }
  const quitar = e.target.closest('[data-quitar]');
  if (quitar){
    const docId = quitar.dataset.quitar, id = quitar.dataset.tarea;
    quitar.disabled = true;
    DB.desatar(docId, quitar.dataset.path || null)
      .then(() => sincronizar(true)).then(() => abrir(id))
      .catch(err => { quitar.disabled = false; estado('No se pudo borrar: ' + err.message, 'err'); });
    return;
  }
  const quitarL = e.target.closest('[data-quitar-local]');
  if (quitarL){
    const i = +quitarL.dataset.quitarLocal, id = quitarL.dataset.tarea;
    misDocs[id] = (misDocs[id]||[]).filter((_, n) => n !== i);
    LS.set('g1-docs', misDocs);
    abrir(id);
    return;
  }
  const verEnlace = e.target.closest('[data-enlace]');
  if (verEnlace){
    const f = document.getElementById('formenlace');
    f.hidden = !f.hidden;
    if (!f.hidden) document.getElementById('dn').focus();
    return;
  }
  const subir = e.target.closest('[data-subir]');
  if (subir){
    if (!DB.on){ estado('Conecta la base de datos para poder subir archivos', 'err'); return; }
    const picker = document.getElementById('picker');
    picker.onchange = () => subirArchivos(subir.dataset.subir, picker.files);
    picker.click();
    return;
  }
  const ver = e.target.closest('[data-ver]');
  if (ver){ abrir(ver.dataset.ver); return; }
  const add = e.target.closest('[data-add]');
  if (add){
    const id = add.dataset.add;
    const n = document.getElementById('dn').value.trim();
    const u = document.getElementById('du').value.trim();
    if (!n || !u) return;
    if (DB.on){
      add.disabled = true;
      DB.atar(id, n, u)
        .then(() => sincronizar(true)).then(() => abrir(id))
        .catch(err => { add.disabled = false; estado('No se pudo atar: ' + err.message, 'err'); });
    } else {
      misDocs[id] = (misDocs[id]||[]).concat({nombre:n, url:u});
      LS.set('g1-docs', misDocs);
      abrir(id);
    }
    return;
  }
  if (e.target.closest('[data-cerrar]') || e.target.id==='velo') cerrar();
});
addEventListener('keydown', e => { if (e.key==='Escape') cerrar(); });

const PERS = DATOS.equipo.map(p => p.nombre);
document.getElementById('f-per').innerHTML =
  PERS.map(p => '<button data-p="'+p+'" aria-pressed="false">'+p+'</button>').join(' ');

function botones(){
  document.getElementById('f-todo').setAttribute('aria-pressed', !fPer);
  document.querySelectorAll('#f-per button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p===fPer));
  document.getElementById('f-crit').setAttribute('aria-pressed', fCrit);
  document.getElementById('f-guia').setAttribute('aria-pressed', fGuia);
  document.getElementById('f-pend').setAttribute('aria-pressed', fPend);
}
document.getElementById('f-todo').onclick = () => { fPer=null; botones(); render(); };
document.querySelectorAll('#f-per button').forEach(b =>
  b.onclick = () => { fPer = fPer===b.dataset.p ? null : b.dataset.p; botones(); render(); });
document.getElementById('f-crit').onclick = () => { fCrit=!fCrit; botones(); render(); };
document.getElementById('f-guia').onclick = () => { fGuia=!fGuia; botones(); render(); };
document.getElementById('f-pend').onclick = () => { fPend=!fPend; botones(); render(); };

/* arrastrar el calendario */
(function(){
  const s = document.getElementById('scroll');
  let ab=false, x0=0, s0=0;
  s.addEventListener('pointerdown', e => {
    if (e.target.closest('.name') || e.target.closest('.bar')) return;
    ab=true; x0=e.clientX; s0=s.scrollLeft; s.style.cursor='grabbing';
  });
  addEventListener('pointerup', () => { ab=false; s.style.cursor=''; });
  addEventListener('pointermove', e => { if (ab) s.scrollLeft = s0-(e.clientX-x0); });
})();

render();
sincronizar();

/* Refrescar lo que hayan marcado los demás: cada 25 s y al volver a la pestaña. */
if (DB.on){
  setInterval(() => { if (!document.hidden) sincronizar(true); }, 25000);
  addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(true); });
}
</script>
